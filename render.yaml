services:
  - type: web
    name: finance-advisor
    env: python
    plan: free
    buildCommand: pip install -r requirements.txt && python manage.py collectstatic --noinput
    startCommand: gunicorn finance_advisor.wsgi:application
    envVars:
      - key: DJANGO_SECRET_KEY
        generateValue: true
      - key: DJANGO_DEBUG
        value: "False"
      - key: DJANGO_ALLOWED_HOSTS
        value: "finance-advisor.onrender.com"
      - key: DJANGO_CSRF_TRUSTED_ORIGINS
        value: "https://finance-advisor.onrender.com"
      - key: GEMINI_MODEL
        value: "models/gemini-1.5-flash"
      - key: GEMINI_API_KEY
        sync: false
